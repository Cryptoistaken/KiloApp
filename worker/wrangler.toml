# Edge API (Cloudflare Workers) — stage 1: stateless routes + safe reads.
# The Bun/Railway backend (src/server.ts) stays live for all writes until
# the transactional ops are rewritten (see plan.md section E notes).
name = "kiloapi"
main = "src/entry.ts"
compatibility_date = "2026-09-24"

[triggers]
crons = ["*/1 * * * *"]

[vars]
FRONTEND_URL = "https://sheetsubmit.pages.dev"

# Secrets below are set with `wrangler secret put <NAME>` (never committed):
#   DATABASE_URL   Neon pooled URL (postgresql://...?sslmode=require) — reads only in stage 1
#   SESSION_SECRET HMAC secret for ss_session cookies (same value as Railway backend)
#   ADMIN_IDS      comma-separated Telegram IDs allowed past isAdmin gates
#   KILO_API_KEY   Bearer key guarding /v1/feed|numbers|otp|meta|stream (empty = allow, local dev)
#   ADMIN_KEY      Bearer key guarding /v1/admin/* (empty = allow, local dev)
#   VOLTX_API_KEY  upstream SMS provider key (one slot per key)
#   MNIT_API_KEY   (+ MNIT_API_BASE override, default https://api.2oo9.cloud/MXS47FLFX0U/tnemn/@public/api)
#   ZENEX_API_KEY  (+ ZENEX_API_BASE / ZENEX_WEB_BASE overrides)
