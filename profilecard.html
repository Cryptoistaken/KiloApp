<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProxyCard v2 - proper mock</title>
<style>
  :root {
    --page: #0a0a0a;
    --text: #ffffff;
    --text2: #aaaaaa;
    --card: #0a0a0a;
    --border: #2a2a2a;
    --green: #22c55e;
    --green-text: #22c55e;
    --red: #ef4444;
    --primary: #ffffff;
    --onprimary: #000000;
    --selbg: #1c1c1e;
    --tile: #161616;
  }
  /* Light theme mirrors Color.kt light scheme */
  body.light {
    --page: #ffffff;
    --text: #000000;
    --text2: #555555;
    --card: #ffffff;
    --border: #e5e5e5;
    --green: #16a34a;
    --green-text: #16a34a;
    --red: #dc2626;
    --primary: #000000;
    --onprimary: #ffffff;
    --selbg: #eeeeee;
    --tile: #f4f4f4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--page); color: var(--text);
    padding: 24px 16px 96px; max-width: 560px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  .page-bar { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 12px; }
  .page-bar h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.25px; }

  /* ---------- card row ----------
     Hierarchy: icon = country flag only | line1 name + status | line2 country + provider | line3 host */
  .card {
    display: flex; align-items: center; gap: 12px;
    background: var(--tile); border: 1px solid transparent;
    border-radius: 0; padding: 12px 14px; margin-bottom: 10px;
    cursor: pointer;
  }
  .icon-wrap { flex: 0 0 auto; width: 38px; align-self: center; }
  .flag-big {
    display: block; width: 38px; height: 28px;
    border-radius: 7px; overflow: hidden;
  }
  .flag-big svg { display: block; width: 100%; height: 100%; }
  .tile-neutral {
    width: 38px; height: 28px;
    display: flex; align-items: center; justify-content: center;
  }
  .tile-neutral svg { width: 26px; height: 26px; fill: var(--text2); }
  .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .name-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .host-line {
    font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text2); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .name {
    font-size: 14px; font-weight: 600; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* App signal_dot: plain 7px oval #22C55E, hidden when offline (matches bubble popup row_dot) */
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: #22C55E; }
  .dot.off { display: none; }
  .sub2 {
    font-size: 12px; color: var(--text2); margin-top: 2px; line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .right {
    display: flex; flex-direction: column; align-items: flex-end;
    justify-content: center; align-self: stretch; flex: 0 0 auto;
    padding: 2px 0;
  }
  .used { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .used-cap { font-size: 10px; color: var(--text2); }

  /* ---------- bottom sheet ---------- */
  .scrim {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: rgba(0, 0, 0, 0.55);
    align-items: flex-end; justify-content: center;
  }
  .scrim.open { display: flex; }
  .sheet {
    width: 100%; max-width: 560px; background: var(--card);
    border-radius: 24px 24px 0 0; padding: 10px 18px 24px;
    animation: rise 0.22s ease-out;
  }
  @keyframes rise { from { transform: translateY(40px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  .grab { width: 72px; height: 5px; border-radius: 3px; background: var(--text2); opacity: 0.5; margin: 0 auto 12px; }
  .sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .used-wrap { display: flex; flex-direction: column; align-items: flex-end; }
  .sheet-head .name { font-size: 16px; }
  .facts { display: flex; gap: 12px; margin-bottom: 12px; }
  .facts .cell { flex: 1; min-width: 0; }
  .k { font-size: 12px; color: var(--text2); margin-bottom: 2px; }
  .v { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .v.green { color: var(--green-text); font-weight: 700; }
  hr { border: 0; border-top: 1px solid var(--border); margin-bottom: 12px; }
  .menu-row {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: none; border: 0; color: var(--text);
    font-size: 15px; padding: 7px 4px; cursor: pointer; text-align: left;
  }
  .menu-row svg { width: 22px; height: 22px; flex: 0 0 auto; }
  .menu-row.danger { color: var(--red); }
  .menu-row:disabled { opacity: 0.55; cursor: default; }
  /* Copy feedback: button animates + flashes green, no toast */
  .menu-row.copied { color: var(--green-text); font-weight: 700; }
  .menu-row.pop { animation: pop 0.25s ease-out; }
  @keyframes pop { 0% { transform: scale(0.96); } 100% { transform: none; } }
  .close-row { display: flex; justify-content: center; margin-top: 8px; }
  .close-row button {
    font-size: 14px; color: var(--text2); background: none;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 26px; cursor: pointer;
  }
  .toast {
    display: none; position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
    background: var(--text); color: var(--page); font-size: 13px; font-weight: 600;
    padding: 10px 18px; border-radius: 9999px; z-index: 20; white-space: nowrap;
  }
  .toast.show { display: block; }

  /* ---------- delete snackbar with Undo (no confirm on swipe-delete) ---------- */
  .snackbar {
    display: none; position: fixed; left: 16px; right: 16px; bottom: 78px; z-index: 15;
    background: var(--text); color: var(--page); border-radius: 12px;
    padding: 8px 4px 8px 16px; align-items: center; gap: 4px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); max-width: 528px; margin: 0 auto;
    font-size: 13px; font-weight: 600;
  }
  .snackbar.show { display: flex; animation: snackIn 0.22s ease-out; }
  @keyframes snackIn { from { transform: translateY(12px); opacity: 0; } }
  .snackbar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snackbar button {
    background: none; border: 0; color: var(--green); font-weight: 800;
    font-size: 13px; padding: 8px 12px; cursor: pointer; font-family: inherit;
  }

  /* ---------- edit sheet (mirrors AddEditProxySheet) ---------- */
  .etitle { font-size: 16px; font-weight: 700; margin-top: 10px; margin-bottom: 10px; }
  .efield { margin-bottom: 8px; min-width: 0; }
  .efield label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }
  .efield input, .efield select {
    width: 100%; font-size: 14px; color: var(--text); font-family: inherit;
    background: var(--page); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; outline: none;
  }
  .erow { display: flex; gap: 8px; }
  .erow .grow3 { flex: 3; } .erow .grow1 { flex: 1; }
  .pw-wrap { position: relative; }
  .pw-wrap button {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--text2); font-size: 13px; cursor: pointer;
  }
  .eactions { display: flex; gap: 8px; margin-top: 16px; }
  .ebtn {
    flex: 1; font-size: 13px; padding: 10px 0; border-radius: 8px;
    border: 1px solid var(--border); background: none; color: var(--text); cursor: pointer;
  }
  .ebtn.primary { background: var(--green); border: 0; color: #06130c; font-weight: 700; }
  .ebtn:disabled { opacity: 0.45; cursor: default; }
  .ebtn.ok { border-color: var(--green); color: var(--green-text); font-weight: 700; }
  .echips { display: flex; gap: 6px; }
  .echip {
    flex: 1; font-size: 12px; padding: 8px 0; border-radius: 8px;
    border: 1px solid var(--border); background: none; color: var(--text2); cursor: pointer;
  }
  .echip.on { border-color: var(--green); color: var(--green-text); font-weight: 700; }

  /* ---------- search + FAB (mirrors ProxiesScreen) ---------- */
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .search svg { width: 18px; height: 18px; fill: var(--text2); flex: 0 0 auto; }
  .search input {
    flex: 1; min-width: 0; background: none; border: 0; outline: none;
    font-size: 14px; color: var(--text); font-family: inherit;
  }
  .search input::placeholder { color: var(--text2); }
  .fab {
    position: fixed; right: 20px; bottom: 86px; width: 56px; height: 56px;
    border-radius: 50%; border: 0; cursor: pointer;
    background: var(--green); color: #06130c; font-size: 28px; line-height: 1;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); z-index: 5;
  }
  body.selecting .fab { display: none; }

  /* ---------- multi-select mode ---------- */
  .selbox {
    display: none; width: 20px; height: 20px; border-radius: 6px;
    border: 2px solid var(--text2); flex: 0 0 auto; position: relative;
  }
  body.selecting .selbox { display: block; }
  .card.picked .selbox { border-color: var(--green); background: var(--green); }
  .card.picked .selbox::after {
    content: ''; position: absolute; left: 6px; top: 2px; width: 4px; height: 9px;
    border: solid #06130c; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .bulkbar {
    display: none; position: fixed; left: 16px; right: 16px; bottom: 78px; z-index: 6;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 12px; align-items: center; gap: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); max-width: 528px; margin: 0 auto;
  }
  .bulkbar.show { display: flex; }
  /* Theme-based, 3 equal buttons: Cancel + Select all = neutral outline,
     Delete = filled error red. Count lives in the list header. */
  .bulkbar button {
    flex: 1; font-size: 13px; font-weight: 600; padding: 9px 4px; border-radius: 8px; cursor: pointer;
    background: none; border: 1px solid var(--border); color: var(--text);
    white-space: nowrap; text-align: center;
  }
  .bulkbar button.primary { background: var(--primary); border-color: var(--primary); color: var(--onprimary); }
  .bulkbar button.danger { border-color: var(--red); color: var(--red); }
  .bulkbar button.danger-fill { background: var(--red); border-color: var(--red); color: #ffffff; }
  .bulkbar button:disabled { opacity: 0.35; cursor: default; }
  /* Overlay selection style (alternative to the tick box):
     picked card gets a primary border + tinted background, no checkbox. */
  body.selecting.sel-overlay .selbox { display: none; }
  body.sel-overlay .card.picked { border-color: var(--primary); background: var(--selbg); }
  /* Small selected-count at the top of the proxy list (not the page header) */
  .selcount { display: none; font-size: 12px; color: var(--text2); margin: 0 0 8px 2px; }
  .selcount.show { display: block; }

  /* ---------- bottom tabs (mirrors AppNavigation NavigationBar) ----------
     The bulkbar sits above the tabs, never on top of them. */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; background: var(--card); border-top: 1px solid var(--border);
    padding: 8px 0 10px; max-width: 560px; margin: 0 auto;
  }
  .tabbar .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: 0; color: var(--text2); font-size: 11px; cursor: pointer;
    font-family: inherit; padding: 0;
  }
  .tabbar .tab svg { width: 24px; height: 24px; }
  .tabbar .tab.on { color: var(--primary); font-weight: 700; }

  /* ---------- swipe actions: release past 110px to commit, no buttons ----------
     Right = Edit, left = Delete (confirm). Short drags snap back. */
  .swipe-wrap { position: relative; overflow: hidden; border-radius: 0; margin-bottom: 10px; max-height: 200px;
    transition: max-height 0.25s ease, opacity 0.2s ease, margin-bottom 0.25s ease; }
  .swipe-wrap.deleting { max-height: 0; opacity: 0; margin-bottom: 0; }
  .swipe-wrap.restoring { animation: cardIn 0.25s ease-out; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(-8px); } }
  .swipe-wrap .card { margin-bottom: 0; position: relative; z-index: 1; touch-action: pan-y; transition: transform 0.18s ease-out; }
  .swipe-bg { position: absolute; inset: 0; display: flex; justify-content: space-between; z-index: 0; pointer-events: none; }
  .swipe-hint { flex: 0 0 84px; display: flex; align-items: center; justify-content: center; }
  .swipe-hint svg { width: 22px; height: 22px; }
  .swipe-hint.edit { background: var(--selbg); color: var(--text); }
  .swipe-hint.del { background: var(--red); color: #ffffff; }
  body.selecting .swipe-wrap .card { transform: none !important; }
</style>
</head>

      <div class="facts">
        <div class="cell"><div class="k">Data Used</div><div class="v green" id="sheetUsed">1.2 GB</div></div>
        <div class="cell"><div class="k">Server</div><div class="v mono" id="sheetServer">change4.owlproxy.com</div></div>
      </div>
      <hr>
      <button class="menu-row" id="copyBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span>Copy</span>
      </button>
      <button class="menu-row" id="testBtn">
        <svg viewBox="0 0 20 20" fill="currentColor"><title>network</title><path d="M2.32 9.91a9.5 9.5 0 0 1 15.36 0l1.43-1.43a11.5 11.5 0 0 0-18.22 0zm3.63 3.62a4.5 4.5 0 0 1 8.1 0l1.45-1.48a6.5 6.5 0 0 0-11.02 0z"/><circle cx="10" cy="15.5" r="1.5"/></svg>
        <span>Test</span>
      </button>
      <button class="menu-row" id="editBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><title>pencil</title><path d="M20.71 7.04c.39-.39.39-1.04 0-1.41l-2.34-2.34c-.37-.39-1.02-.39-1.41 0l-1.84 1.83l3.75 3.75M3 17.25V21h3.75L17.81 9.93l-3.75-3.75z"/></svg>
        <span>Edit</span>
      </button>
      <button class="menu-row" id="dupBtn">
        <svg viewBox="0 0 20 20" fill="currentColor"><title>duplicate</title><path d="M9 2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V6.414A2 2 0 0 0 16.414 5L14 2.586A2 2 0 0 0 12.586 2z"/><path d="M3 8a2 2 0 0 1 2-2v10h8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Duplicate</span>
      </button>
      <button class="menu-row" id="selBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><title>select</title><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20m-1.2 14.2-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4z"/></svg>
        <span>Select</span>
      </button>
      <button class="menu-row danger" id="delBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><title>delete</title><path d="M7 21q-.825 0-1.412-.587T5 19V6H4V4h5V3h6v1h5v2h-1v13q0 .825-.587 1.413T17 21zm2-4h2V8H9zm4 0h2V8h-2z"/></svg>
        <span>Delete</span>
      </button>
      <div class="close-row"><button onclick="closeSheet()">Close</button></div>
    </div>
  </div>

  <!-- Edit sheet: Step 1 Connection / Step 2 Name and IP Mode -->
  <div class="scrim" id="editScrim">
    <div class="sheet" role="dialog" aria-label="Edit proxy">
      <div class="grab"></div>
      <div class="etitle" id="editTitle">Edit Proxy</div>
      <div>
        <div class="erow" style="margin-bottom:8px">
          <button class="ebtn" style="flex:1" onclick="toast('Copied to clipboard')">Copy</button>
          <button class="ebtn" style="flex:1" onclick="toast('Pasted from clipboard')">Paste</button>
        </div>
        <div class="erow">
          <div class="efield grow3"><label>Host</label><input id="eHost" placeholder="proxy.example.com" autocomplete="off"></div>
          <div class="efield grow1"><label>Port</label><input id="ePort" placeholder="1080" inputmode="numeric" autocomplete="off"></div>
        </div>
        <div class="efield"><label>Username</label><input id="eUser" placeholder="user" autocomplete="off"></div>
        <div class="efield"><label>Password</label>
          <div class="pw-wrap"><input id="ePass" type="password" placeholder="pass"><button type="button" id="eEye">Show</button></div>
        </div>
        <div class="efield"><label>Country</label>
          <select id="eCountry">
            <option value="">None</option>
            <option value="US">United States</option>
            <option value="GB">United Kingdom</option>
            <option value="DE">Germany</option>
            <option value="FR">France</option>
          </select>
        </div>
        <div class="efield"><label>Profile Name</label><input id="eName" placeholder="e.g. My Proxy" autocomplete="off"></div>
        <div class="efield"><label>IP Mode</label>
          <select id="eMode">
            <option value="unique">Unique</option>
            <option value="sticky">Sticky</option>
          </select>
        </div>
        <div class="efield" id="eTimeWrap" style="display:none"><label>IP Stick Time in minutes</label>
          <div class="echips" id="eChips">
            <button class="echip on">5</button><button class="echip">10</button><button class="echip">15</button><button class="echip">30</button><button class="echip">60</button><button class="echip">90</button>
          </div>
        </div>
      </div>
      <div class="eactions">
        <button class="ebtn" onclick="closeEdit()">Cancel</button>
        <button class="ebtn" id="eTest">Test</button>
        <button class="ebtn primary" id="eSave" disabled>Save</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="snackbar" id="snackbar" role="status">
    <span id="snackMsg"></span>
    <button id="snackUndo" type="button">Undo</button>
  </div>
  <div class="bulkbar" id="bulkbar">
    <button onclick="exitSelect()">Cancel</button>
    <button class="primary" id="selAllBtn" onclick="selAll()">Select all</button>
    <button class="danger-fill" id="bulkDel" onclick="delSel()">Delete</button>
  </div>
  <nav class="tabbar" aria-label="Bottom navigation">
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c-5 5-5 12 0 17M12 3.5c5 5 5 12 0 17"/></svg><span>Countries</span></button>
    <button class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l8-4 8 4-8 4z"/><path d="M4 12.5l8 4 8-4"/><path d="M4 16.5l8 4 8-4"/></svg><span>Profiles</span></button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg><span>Settings</span></button>
  </nav>

<script>
  var DATA = {
    owl: { flag: true, name: 'Profile 1', sub: 'United States',
           provider: 'OwlProxy', used: '1.2 GB', server: 'change4.owlproxy.com',
           host: 'change4.owlproxy.com', port: '7778',
           user: 'base_custom_zone_US', pass: 'secret1', cc: 'US' },
    custom: { flag: false, name: 'My Custom Proxy', sub: 'Custom proxy',
              provider: 'Custom', used: '0 B', server: '192.168.100.250',
              host: '192.168.100.250', port: '1080',
              user: 'user', pass: 'pass', cc: '' }
  };
  var scrim = document.getElementById('scrim');
  var currentKey = null, currentCard = null, copyN = 0, selecting = false;
  /* Long-press (500ms) on a card enters multi-select and picks it.
     Delegated so cloned cards work too; the click after a long-press is swallowed. */
  var pressTimer = null, longFired = false;
  document.addEventListener('pointerdown', function (e) {
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (!card) return;
    longFired = false;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function () {
      longFired = true;
      if (!selecting) enterSelect();
      card.classList.add('picked');
      updateSel();
    }, 500);
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    document.addEventListener(ev, function () { clearTimeout(pressTimer); });
  });
  document.addEventListener('contextmenu', function (e) {
    if (e.target.closest && e.target.closest('.card')) e.preventDefault();
  });
  function cardTap(key, el) {
    if (longFired) { longFired = false; return; }
    if (selecting) {
      el.classList.toggle('picked');
      updateSel();
    } else {
      openSheet(key, el);
    }
  }
  /* ---------- two-sided swipe with direct action, no buttons ----------
     Release past 110px to commit: right = Edit, left = Delete (confirm).
     Short drags snap back. Dragging cancels long-press and swallows the tap. */
  var dragState = null;
  function closeSwipes(except) {
    document.querySelectorAll('.swipe-wrap').forEach(function (w) {
      if (w !== except) w.querySelector('.card').style.transform = '';
    });
  }
  function wrapKey(wrap) {
    var m = (wrap.querySelector('.card').getAttribute('onclick') || '').match(/cardTap\('([^']+)'/);
    return m ? m[1] : null;
  }
  function commitEdit(wrap) {
    currentKey = wrapKey(wrap);
    currentCard = wrap.querySelector('.card');
    openEdit();
  }
  var snackTimer = null;
  function showSnack(msg, onUndo) {
    var s = document.getElementById('snackbar');
    document.getElementById('snackMsg').textContent = msg;
    document.getElementById('snackUndo').onclick = function () {
      clearTimeout(snackTimer);
      s.classList.remove('show');
      if (onUndo) onUndo();
    };
    s.classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(function () { s.classList.remove('show'); }, 5000);
  }
  function commitDelete(wrap) {
    var name = DATA[wrapKey(wrap)].name;
    var parent = wrap.parentNode, next = wrap.nextSibling;
    wrap.style.maxHeight = wrap.offsetHeight + 'px';
    void wrap.offsetHeight;
    wrap.classList.add('deleting');
    setTimeout(function () { wrap.remove(); }, 260);
    showSnack('Deleted "' + name + '"', function () {
      wrap.classList.remove('deleting');
      wrap.style.maxHeight = '';
      wrap.classList.add('restoring');
      parent.insertBefore(wrap, next);
      setTimeout(function () { wrap.classList.remove('restoring'); }, 300);
    });
  }
  function wireSwipe(wrap) {
    var card = wrap.querySelector('.card');
    card.addEventListener('pointerdown', function (e) {
      if (selecting) return;
      closeSwipes(wrap);
      dragState = { card: card, x0: e.clientX, dx: 0 };
    });
    card.addEventListener('pointermove', function (e) {
      if (!dragState || dragState.card !== card || selecting) return;
      var dx = e.clientX - dragState.x0;
      if (Math.abs(dx) > 10) { clearTimeout(pressTimer); longFired = true; }
      if (Math.abs(dx) > 8) {
        dragState.dx = dx;
        card.style.transition = 'none';
        card.style.transform = 'translateX(' + Math.max(-120, Math.min(120, dx)) + 'px)';
      }
    });
    ['pointerup', 'pointercancel'].forEach(function (ev) {
      card.addEventListener(ev, function () {
        if (!dragState || dragState.card !== card) return;
        var dx = dragState.dx, cancelled = (ev === 'pointercancel');
        dragState = null;
        card.style.transition = '';
        card.style.transform = '';
        if (cancelled || selecting) return;
        if (dx >= 110) commitEdit(wrap);
        else if (dx <= -110) commitDelete(wrap);
      });
    });
  }
  document.querySelectorAll('.swipe-wrap').forEach(wireSwipe);
  function enterSelect() {
    selecting = true;
    document.body.classList.add('selecting');
    closeSwipes();
    updateSel();
  }
  function exitSelect() {
    selecting = false;
    document.body.classList.remove('selecting');
    document.querySelectorAll('.card.picked').forEach(function (c) { c.classList.remove('picked'); });
    updateSel();
  }
  function updateSel() {
    var n = document.querySelectorAll('.card.picked').length;
    var label = document.getElementById('selcount');
    label.textContent = n + ' selected';
    label.classList.toggle('show', selecting);
    document.getElementById('bulkbar').classList.toggle('show', selecting);
    var del = document.getElementById('bulkDel');
    if (del) del.disabled = (n === 0);
    // Label follows state: only offer Unselect all when all visible cards are picked.
    var cards = visibleCards();
    var all = cards.length > 0 && cards.every(function (c) { return c.classList.contains('picked'); });
    document.getElementById('selAllBtn').textContent = all ? 'Unselect all' : 'Select all';
  }
  function visibleCards() {
    return Array.prototype.slice.call(document.querySelectorAll('.swipe-wrap .card'))
      .filter(function (c) { return c.closest('.swipe-wrap').style.display !== 'none'; });
  }
  function selAll() {
    var cards = visibleCards();
    var all = cards.length > 0 && cards.every(function (c) { return c.classList.contains('picked'); });
    cards.forEach(function (c) { c.classList.toggle('picked', !all); });
    updateSel();
  }
  function delSel() {
    var picks = document.querySelectorAll('.swipe-wrap .card.picked');
    if (!picks.length) return;
    if (confirm('Delete ' + picks.length + ' profiles? This cannot be undone.')) {
      picks.forEach(function (c) { c.closest('.swipe-wrap').remove(); });
      exitSelect();
    }
  }
  function openSheet(key, el) {
    closeSwipes();
    var d = DATA[key];
    currentKey = key;
    currentCard = el || currentCard;
    document.getElementById('sheetFlag').style.display = d.flag ? 'block' : 'none';
    document.getElementById('sheetNeutral').style.display = d.flag ? 'none' : 'flex';
    document.getElementById('sheetName').textContent = d.name;
    document.getElementById('sheetSub').textContent = d.sub;
    document.getElementById('sheetProvider').textContent = d.provider;
    document.getElementById('sheetUsed').textContent = d.used;
    document.getElementById('sheetServer').textContent = d.server;
    var t = document.querySelector('#testBtn span');
    t.textContent = 'Test';
    document.getElementById('testBtn').disabled = false;
    scrim.classList.add('open');
  }
  function closeSheet() { scrim.classList.remove('open'); }
  scrim.addEventListener('click', function (e) { if (e.target === scrim) closeSheet(); });
  document.getElementById('copyBtn').addEventListener('click', function () {
    var b = this, label = b.querySelector('span');
    if (b.dataset.busy) return;
    var d = DATA[currentKey];
    var s = [d.host, d.port, d.user, d.pass].join(':');
    if (navigator.clipboard) navigator.clipboard.writeText(s).catch(function () {});
    b.dataset.busy = '1';
    label.textContent = 'Copied';
    b.classList.add('copied');
    b.classList.add('pop');
    setTimeout(function () {
      label.textContent = 'Copy';
      b.classList.remove('copied');
      b.classList.remove('pop');
      delete b.dataset.busy;
    }, 1200);
  });
  document.getElementById('testBtn').addEventListener('click', function () {
    var b = this, label = b.querySelector('span');
    b.disabled = true; label.textContent = 'Testing';
    setTimeout(function () { b.disabled = false; label.textContent = 'Test'; }, 1500);
  });
  var toastTimer = null;
  function toggleTheme() {
    var light = document.body.classList.toggle('light');
    document.getElementById('themeBtn').textContent = light ? 'Dark' : 'Light';
  }
  function toggleSelStyle() {
    var ov = document.body.classList.toggle('sel-overlay');
    document.getElementById('selStyleBtn').textContent = ov ? 'Tick' : 'Overlay';
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  document.getElementById('editBtn').addEventListener('click', function () {
    openEdit();
  });
  document.getElementById('dupBtn').addEventListener('click', function () {
    var src = DATA[currentKey];
    copyN += 1;
    var key = 'copy' + copyN;
    DATA[key] = { flag: src.flag, name: src.name + ' (copy)', sub: src.sub,
                  provider: src.provider, used: '0 B', server: src.server,
                  host: src.host, port: src.port, user: src.user, pass: src.pass, cc: src.cc };
    var srcWrap = currentCard.closest('.swipe-wrap');
    var clone = srcWrap.cloneNode(true);
    var cloneCard = clone.querySelector('.card');
    cloneCard.style.transform = '';
    cloneCard.classList.remove('picked');
    cloneCard.querySelector('.name').textContent = DATA[key].name;
    cloneCard.querySelector('.dot').classList.add('off');
    cloneCard.querySelector('.used').textContent = '0 B';
    cloneCard.setAttribute('onclick', "cardTap('" + key + "', this)");
    srcWrap.parentNode.insertBefore(clone, srcWrap.nextSibling);
    wireSwipe(clone);
    closeSheet();
    toast('Duplicated as "' + DATA[key].name + '"');
  });
  document.getElementById('selBtn').addEventListener('click', function () {
    closeSheet();
    enterSelect();
  });
  document.getElementById('delBtn').addEventListener('click', function () {
    if (confirm('Delete profile "' + DATA[currentKey].name + '"? This cannot be undone.')) {
      currentCard.closest('.swipe-wrap').remove();
      closeSheet();
    }
  });

  /* ---------- search ---------- */
  document.getElementById('q').addEventListener('input', function () {
    var q = this.value.trim().toLowerCase();
    document.querySelectorAll('.swipe-wrap').forEach(function (w) {
      var name = w.querySelector('.name').textContent.toLowerCase();
      w.style.display = (q === '' || name.indexOf(q) !== -1) ? '' : 'none';
    });
  });

  /* ---------- edit sheet ---------- */
  var editScrim = document.getElementById('editScrim');
  var editKey = null, editIsAdd = false, testPassed = false;
  var eHost = document.getElementById('eHost'), ePort = document.getElementById('ePort'),
      eUser = document.getElementById('eUser'), ePass = document.getElementById('ePass'),
      eName = document.getElementById('eName'), eCountry = document.getElementById('eCountry'),
      eMode = document.getElementById('eMode'),
      eSave = document.getElementById('eSave');
  function eValidate() {
    var ok = eHost.value.trim() !== '' && /^[0-9]{1,5}$/.test(ePort.value.trim()) &&
             eUser.value !== '' && ePass.value !== '' && eName.value.trim() !== '';
    eSave.disabled = !(ok && testPassed);
  }
  function eFill(d) {
    eHost.value = d.host; ePort.value = d.port;
    eUser.value = d.user; ePass.value = d.pass;
    eName.value = d.name; eCountry.value = d.cc || '';
    eMode.value = 'unique';
    document.getElementById('eTimeWrap').style.display = 'none';
  }
  function openEdit() {
    editIsAdd = false; editKey = currentKey; testPassed = false;
    document.getElementById('editTitle').textContent = 'Edit Proxy';
    eFill(DATA[editKey]);
    eResetTest(); eValidate(); closeSheet();
    editScrim.classList.add('open');
  }
  function openAdd() {
    editIsAdd = true; testPassed = false;
    editKey = 'new' + Date.now();
    document.getElementById('editTitle').textContent = 'Add Proxy';
    eFill({ host: '', port: '1080', user: '', pass: '',
            name: 'Profile ' + (document.querySelectorAll('.card').length + 1), cc: '' });
    eResetTest(); eValidate();
    editScrim.classList.add('open');
  }
  function closeEdit() { editScrim.classList.remove('open'); }
  editScrim.addEventListener('click', function (e) { if (e.target === editScrim) closeEdit(); });
  [eHost, ePort, eUser, ePass, eName].forEach(function (el) {
    el.addEventListener('input', function () { testPassed = false; eResetTest(); eValidate(); });
  });
  function eResetTest() {
    var t = document.getElementById('eTest');
    t.textContent = 'Test';
    t.classList.remove('ok');
  }
  document.getElementById('eTest').addEventListener('click', function () {
    var b = this;
    if (b.disabled) return;
    b.disabled = true;
    b.textContent = 'Testing';
    setTimeout(function () {
      b.disabled = false;
      testPassed = true;
      b.textContent = 'Works';
      b.classList.add('ok');
      eValidate();
    }, 1200);
  });
  document.getElementById('eEye').addEventListener('click', function () {
    var show = ePass.type === 'password';
    ePass.type = show ? 'text' : 'password';
    this.textContent = show ? 'Hide' : 'Show';
  });
  eMode.addEventListener('change', function () {
    document.getElementById('eTimeWrap').style.display = eMode.value === 'sticky' ? '' : 'none';
  });
  document.querySelectorAll('#eChips .echip').forEach(function (c) {
    c.addEventListener('click', function () {
      document.querySelectorAll('#eChips .echip').forEach(function (x) { x.classList.remove('on'); });
      c.classList.add('on');
    });
  });
  eSave.addEventListener('click', function () {
    if (eSave.disabled) return;
    var cc = eCountry.value;
    var ccName = eCountry.options[eCountry.selectedIndex].text;
    if (editIsAdd) {
      var key = 'added' + Date.now();
      var isUS = cc === 'US';
      DATA[key] = { flag: isUS, name: eName.value.trim(), sub: cc ? ccName : 'Custom proxy',
                    provider: cc ? (isUS ? 'OwlProxy' : 'Custom') : 'Custom', used: '0 B',
                    host: eHost.value.trim(), server: eHost.value.trim(),
                    port: ePort.value.trim(), user: eUser.value, pass: ePass.value, cc: cc };
      var tpl = document.querySelector(isUS ? '.card .flag-big' : '.card .tile-neutral').closest('.swipe-wrap').cloneNode(true);
      var tplCard = tpl.querySelector('.card');
      tplCard.style.transform = '';
      tplCard.classList.remove('picked');
      tplCard.querySelector('.name').textContent = DATA[key].name;
      tplCard.querySelector('.host-line').textContent = DATA[key].host;
      tplCard.querySelector('.used').textContent = '0 B';
      tplCard.querySelector('.dot').classList.add('off');
      tpl.style.display = '';
      tplCard.setAttribute('onclick', "cardTap('" + key + "', this)");
      var search = document.querySelector('.search');
      search.parentNode.insertBefore(tpl, search.nextSibling);
      wireSwipe(tpl);
    } else {
      var d = DATA[editKey];
      d.host = eHost.value.trim(); d.server = d.host;
      d.port = ePort.value.trim(); d.user = eUser.value; d.pass = ePass.value;
      d.name = eName.value.trim(); d.cc = cc;
      currentCard.querySelector('.name').textContent = d.name;
      currentCard.querySelector('.host-line').textContent = d.host;
    }
    closeEdit();
    toast('Saved');
  });
</script>
</body>
</html>
