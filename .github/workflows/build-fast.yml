name: Fast APK (arm64 debug)

# Own lane, separate from the release build: both workflows run at the same
# time without cancelling each other (a shared concurrency group would).
# Re-dispatching while a fast build runs supersedes it.
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publishing the fast v<code> release

    steps:
      - name: Set git init default branch to master
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 17
          distribution: 'temurin'

      # Same minimal SDK bootstrap as the release lane (runner image already
      # carries platform + build-tools; only install what is missing).
      - name: Setup Android SDK
        run: |
          CMDLINE=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | tail -n 1)
          echo "$CMDLINE" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$CMDLINE/sdkmanager" --licenses --sdk_root="$ANDROID_SDK_ROOT" > /dev/null || true
          NEED=""
          [ -d "$ANDROID_SDK_ROOT/platforms/android-36" ] || NEED="$NEED platforms;android-36"
          [ -d "$ANDROID_SDK_ROOT/build-tools/36.0.0" ] || NEED="$NEED build-tools;36.0.0"
          [ -d "$ANDROID_SDK_ROOT/platform-tools" ] || NEED="$NEED platform-tools"
          if [ -n "$NEED" ]; then
            # shellcheck disable=SC2086
            "$CMDLINE/sdkmanager" --install $NEED --sdk_root="$ANDROID_SDK_ROOT"
          else
            echo "SDK packages already present, skipping install"
          fi
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
          key: ndk-27.0.12077973

      - name: Install NDK (skip if present)
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          if [ -d "$NDK_DIR" ]; then
            echo "NDK 27.0.12077973 already present, skipping install"
          else
            echo "NDK not found, installing..."
            sdkmanager "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Release keystore: the fast APK is signed with the release key so it
      # installs over release builds via the in-app updater (a debug-key APK
      # would fail with a signature mismatch).
      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/ks"
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks/kiloapp-release.jks"
          fi

      # Own cache key, never shared with the release lane: this lane compiles
      # arm64 only, so it must neither read nor overwrite the full 4-ABI
      # native outputs.
      - name: Cache native build outputs (arm64 only)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            app/build/intermediates/cxx
            app/src/main/jniLibs
          key: native-fast-ndk27-${{ hashFiles('app/src/main/jni/**') }}

      # Shared monotonic counter (same rule as the release lane): run_number
      # counts per workflow, so take max(run+100, latest release+1). Used for
      # the APK internal code AND the release tag, so fast and release builds
      # update across each other in either order.
      - name: Compute version code
        id: vc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null | sed 's/^v//')
          case "$LATEST" in ''|*[!0-9]*) LATEST=0;; esac
          CODE=$(( ${{ github.run_number }} + 100 ))
          if [ "$LATEST" -ge "$CODE" ]; then CODE=$(( LATEST + 1 )); fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # Debug + single ABI: skips R8/shrinking and 3/4 of the native
      # compile. Signed with the release key (keystore step above), so the
      # APK installs over release builds via the in-app updater.
      - name: Build arm64 debug APK
        run: gradle :app:assembleDebug -Pabi=arm64-v8a --warning-mode all
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          KILO_VERSION_CODE: ${{ steps.vc.outputs.code }}
          KILO_KEYSTORE_FILE: ${{ runner.temp }}/ks/kiloapp-release.jks
          KILO_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KILO_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KILO_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_GATEWAY_URL: ${{ secrets.SMS_GATEWAY_URL }}

      # Publish as a real v<versionCode> release: the in-app updater reads
      # releases/latest and only accepts v<number> tags, picking the arm64
      # asset.
      - name: Publish fast release (v${{ steps.vc.outputs.code }})
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.vc.outputs.code }}
          name: v${{ steps.vc.outputs.code }} (fast)
          body: "Fast arm64-only debug build (no R8). Release-signed, installs over release builds."
          files: app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-fast-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
