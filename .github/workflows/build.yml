name: Build APK

# Rapid pushes supersede each other: cancel the older run instead of
# building the same branch twice (its release would be stale anyway).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Set git init default branch to master
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 17
          distribution: 'temurin'

      # android-actions/setup-android was pinned but its bundled package
      # list requests the long-removed obsolete "tools" package, failing
      # every run inside sdkmanager before any compilation. Install only
      # what the build needs with the runner's own cmdline-tools instead.
      - name: Setup Android SDK
        run: |
          CMDLINE=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | tail -n 1)
          echo "$CMDLINE" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$CMDLINE/sdkmanager" --licenses --sdk_root="$ANDROID_SDK_ROOT" > /dev/null || true
          # Platform + build-tools survive on the runner image — only install
          # what is actually missing instead of re-installing every run.
          NEED=""
          [ -d "$ANDROID_SDK_ROOT/platforms/android-36" ] || NEED="$NEED platforms;android-36"
          [ -d "$ANDROID_SDK_ROOT/build-tools/36.0.0" ] || NEED="$NEED build-tools;36.0.0"
          [ -d "$ANDROID_SDK_ROOT/platform-tools" ] || NEED="$NEED platform-tools"
          if [ -n "$NEED" ]; then
            # shellcheck disable=SC2086
            "$CMDLINE/sdkmanager" --install $NEED --sdk_root="$ANDROID_SDK_ROOT"
          else
            echo "SDK packages already present, skipping install"
          fi
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      # The NDK download (~75s) dominates setup: cache the extracted tree and
      # only hit the network on a version bump (key change).
      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
          key: ndk-27.0.12077973

      # --- Install NDK only if not already pre-installed on runner ---
      - name: Install NDK (skip if present)
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          if [ -d "$NDK_DIR" ]; then
            echo "NDK 27.0.12077973 already present, skipping install"
          else
            echo "NDK not found, installing..."
            sdkmanager "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/ks"
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks/kiloapp-release.jks"
          fi

      # Native code (badvpn/pdnsd x 4 ABIs) is the slow half of the build.
      # Cache its intermediates AND the copied jniLibs output keyed on the
      # jni sources: Kotlin-only pushes then skip the C compile entirely,
      # while any jni/ change busts the key and rebuilds from scratch.
      # (jniLibs/ is gitignored build output, so it must ride along —
      # an up-to-date native task skips its doLast copy step.)
      - name: Cache native build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            app/build/intermediates/cxx
            app/src/main/jniLibs
          key: native-ndk27-${{ hashFiles('app/src/main/jni/**') }}

      # Shared monotonic counter: run_number counts PER WORKFLOW (a new lane
      # restarts at 1), so take max(run+100, latest release+1). Both lanes use
      # it for the APK internal code AND the release tag, so fast and release
      # builds update across each other in either order.
      - name: Compute version code
        id: vc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null | sed 's/^v//')
          case "$LATEST" in ''|*[!0-9]*) LATEST=0;; esac
          CODE=$(( ${{ github.run_number }} + 100 ))
          if [ "$LATEST" -ge "$CODE" ]; then CODE=$(( LATEST + 1 )); fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # --- Build: all ABIs + universal (universal contains all 4 .so sets; OS picks best at runtime) ---
      - name: Build Release APK
        run: |
          echo "Building universal + per-ABI APKs (all ABIs)"
          gradle assembleRelease --warning-mode all
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          KILO_VERSION_CODE: ${{ steps.vc.outputs.code }}
          KILO_KEYSTORE_FILE: ${{ runner.temp }}/ks/kiloapp-release.jks
          KILO_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KILO_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KILO_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_GATEWAY_URL: ${{ secrets.SMS_GATEWAY_URL }}

      # Append the app version to the APK filenames (read from the built APK
      # itself so tag builds and branch builds always get the right name).
      - name: Rename APK with version name
        run: |
          cd app/build/outputs/apk/release
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -n 1)
          VN=$($AAPT dump badging "$(ls *.apk | head -n 1)" 2>/dev/null \
            | grep -oP "versionName='\K[^']+" | head -n 1)
          for f in *.apk; do
            mv -f "$f" "${f%.apk}-v${VN}.apk"
          done
          echo "Renamed APKs to:"
          ls -1

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      # Build a plain-text changelog from commits since the last release tag:
      # human-readable subjects only (no hashes - the dialog already shows
      # its own version line and "What's new" heading, so no boilerplate).
      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log --format=%s --no-merges "$PREV..HEAD")
          else
            LOG=$(git log --format=%s --no-merges -20)
          fi
          # Release notes are plain ASCII: strip emoji/symbols from subjects.
          LOG=$(printf '%s\n' "$LOG" | LC_ALL=C tr -cd '[:print:]\t\n')
          echo "$LOG" > changelog.md
          echo "Changelog:"
          cat changelog.md

      # Publish only on real branch pushes (not PRs, not tag-triggered runs —
      # tag pushes would create a new tag each run and loop releases).
      - name: Publish GitHub Release (v${{ steps.vc.outputs.code }})
        if: github.ref_type == 'branch' && github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.vc.outputs.code }}
          name: v${{ steps.vc.outputs.code }}
          body_path: changelog.md
          files: app/build/outputs/apk/release/*.apk
