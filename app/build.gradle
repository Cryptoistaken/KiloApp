plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "net.typeblog.socks"
    compileSdk 36

    // Monotonic versionCode so each new build installs over the previous one
    // (adb install -r) without INSTALL_FAILED_VERSION_DOWNGRADE. In CI the
    // GITHUB_RUN_NUMBER strictly increases per workflow run (most reliable);
    // locally we fall back to the git commit count. The +100 offset keeps us
    // above the old fixed code 15 (legacy per-ABI max = 4*67+15 = 283).
    def ghRunNumber = System.getenv('GITHUB_RUN_NUMBER')
    def gitCommitCount = 15
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = out
        }
        gitCommitCount = out.toString().trim().toInteger()
    } catch (Exception ignored) {
    }
    def baseVersionCode
    // CI passes the shared cross-lane counter (max of run+100 and latest
    // release+1); without it fall back to run number, then commit count.
    def envVersionCode = System.getenv('KILO_VERSION_CODE')
    if (envVersionCode != null && envVersionCode.isInteger()) {
        baseVersionCode = envVersionCode.toInteger()
    } else if (ghRunNumber != null && ghRunNumber.isInteger()) {
        baseVersionCode = ghRunNumber.toInteger() + 100
    } else {
        baseVersionCode = gitCommitCount + 100
    }

    // -Pabi=<abi> restricts native compilation AND apk splits to one ABI
    // (fast single-ABI debug builds: CI fast lane + local dev). Release
    // never passes it, so all 4 ABIs still build there.
    def requestedAbi = project.findProperty('abi')?.toString()

    defaultConfig {
        applicationId "com.kiloapp.app"
        // Per-app identity baked at build time: the self-updater reads this
        // from BuildConfig, so forks never need a code edit to point at
        // their own release feed.
        buildConfigField "String", "UPDATE_REPO", '"Cryptoistaken/KiloApp"'
        // SMS gateway (Go backend on Railway): base URL baked with env
        // override; the global app key comes ONLY from the SMS_API_KEY env
        // (CI secret) so it is never committed to the repo.
        def smsGatewayUrl = System.getenv('SMS_GATEWAY_URL')
        buildConfigField "String", "SMS_GATEWAY_URL", '"' + ((smsGatewayUrl != null && smsGatewayUrl.length() > 0) ? smsGatewayUrl : "https://kiloapp.up.railway.app") + '"'
        def smsApiKey = System.getenv('SMS_API_KEY')
        buildConfigField "String", "SMS_API_KEY", '"' + ((smsApiKey != null) ? smsApiKey : "") + '"'
        minSdk 21
        targetSdk 36
        versionCode baseVersionCode
        // Human-readable build number follows the CI counter (run + 100) so
        // the About screen shows which build is installed (e.g. 1.2.160).
        versionName "1.2.${baseVersionCode}"

        ndkVersion = "27.0.12077973"

        externalNativeBuild {
            ndkBuild {
                if (requestedAbi) {
                    abiFilters requestedAbi
                } else {
                    abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                }
            }
        }
    }

    splits {
        abi {
            // Single universal APK (all ABIs in one file, OS picks best .so at install).
            // -Pabi=<abi> still allowed for fast local single-ABI debug builds.
            enable = requestedAbi != null
            reset()
            if (requestedAbi) {
                include(requestedAbi)
            }
        }
    }

    // Preserve legacy .so packaging now that android:extractNativeLibs is being
    // removed from the manifest by another agent.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Persistent release signing: when KILO_KEYSTORE_FILE (and friends) are set —
    // e.g. CI decoding the RELEASE_KEYSTORE_B64 secret — sign every build with the
    // same key so updates install over the old app without uninstalling. Otherwise
    // fall back to the debug key (local / PR builds).
    def env = { name -> def v = System.getenv(name); (v != null && v.length() > 0) ? v : null }
    def ksFile = env('KILO_KEYSTORE_FILE')
    def usePersistentSigning = ksFile != null && new File(ksFile).exists() &&
            env('KILO_KEYSTORE_PASSWORD') != null && env('KILO_KEY_ALIAS') != null && env('KILO_KEY_PASSWORD') != null
    if (!usePersistentSigning) {
        println("⚠️  KILO_KEYSTORE_* not set or keystore missing — falling back to debug keystore; release will NOT install over store builds")
    }

    signingConfigs {
        release {
            if (usePersistentSigning) {
                storeFile file(ksFile)
                storePassword env('KILO_KEYSTORE_PASSWORD')
                keyAlias env('KILO_KEY_ALIAS')
                keyPassword env('KILO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Fast-lane CI signs debug with the release key so in-app
            // updates install over release builds. Locally (no keystore
            // env) this stays the default debug key.
            signingConfig = usePersistentSigning ? signingConfigs.release : signingConfigs.debug
        }

        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = usePersistentSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
        aidl = true
        compose = true
    }

    sourceSets {
        main {
            jniLibs.srcDirs += 'src/main/jniLibs'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// Modern variant API: per-ABI unique versionCode override
// (replaces the obsolete applicationVariants API).
// Map for the version code that gives each ABI a unique version code.
def versionCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86': 3, 'x86_64': 4]
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.identifier == 'abi' }?.value
            if (abi != null) {
                output.versionCode.set(
                        versionCodes.get(abi) * 67 + variant.versionCode.get())
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.toLowerCase().contains("nativebuild") || task.name.toLowerCase().contains("ndkbuild")) {
        task.doLast {
            copy {
                from "build/intermediates/cxx"
                include "**/obj/local/**/pdnsd"
                include "**/obj/local/**/tun2socks"
                into "src/main/jniLibs"
                eachFile { details ->
                    def segments = details.relativePath.segments
                    def abi = segments[-2]
                    def name = segments[-1]
                    details.relativePath = new RelativePath(true, abi, "lib" + name + ".so")
                }
                includeEmptyDirs = false
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.10"
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    // Exact spring physics for the circle-menu item motion (stiffness/damping
    // ported from the HTML mockup's motion config).
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'

    // Compose
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.activity:activity-compose:1.9.2'
    // Direct (not transitive): overlay windows host ComposeView, which needs
    // the view-tree owners + foundation layout on the compile classpath.
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.savedstate:savedstate:1.2.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
